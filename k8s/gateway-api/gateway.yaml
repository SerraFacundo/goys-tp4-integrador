# M13: Gateway de entrada a la app. Lo implementa Cilium (GatewayClass "cilium")
# en modo host network: el Envoy de cada nodo escucha en el puerto 8000 de la IP
# del nodo. Puerto alto porque Envoy corre sin NET_BIND_SERVICE.
# La HTTPRoute de la app (k8s/app/httproute.yaml, R07) se engancha con
# parentRefs goys-gateway / gateway. El quick tunnel (R09) apunta acá.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: goys-tp4
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: goys-gateway
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: goys-tp4
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        # Solo acepta rutas del namespace de la app.
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: app
