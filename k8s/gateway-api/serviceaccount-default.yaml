# M12 (kube-bench 5.1.5): la cuenta de servicio "default" del namespace no monta token.
# En gateway no corre ningún pod: el Envoy del Gateway va dentro del agente de Cilium.
# Así, un pod que se cree acá sin cuenta propia no recibe token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: gateway
automountServiceAccountToken: false
