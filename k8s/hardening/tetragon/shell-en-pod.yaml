# N05: detectar una shell ejecutada dentro de un contenedor (amenaza R del modelo STRIDE).
# - Hook: security_bprm_check, el chequeo LSM que el kernel hace antes de cada exec.
# - Selector 1 (arranque de la shell): el binario a ejecutar termina en un nombre de shell.
#   Dispara aunque la shell no ejecute nada, pero el evento sale a nombre de "runc init"
#   (todavía no es la shell) y sin pod: runc es un binario del host.
# - Selector 2 (la shell ejecuta un comando): el proceso que hace el exec ES una shell.
#   Ese evento sí trae el pod, la shell y el comando (en el argumento linux_binprm).
# - Las dos listas incluyen "/dash" y "/busybox" por si el path llega resuelto
#   (en Ubuntu "sh" es un link a dash, en Alpine a busybox).
# - matchNamespaces: solo procesos fuera del PID namespace del host, o sea dentro de
#   un contenedor. Las shells de los nodos (SSH, systemd) no generan eventos.
# - Sin acción de bloqueo: solo registra (Post). La respuesta es el simulacro de N06.
# La aplica la Application "tetragon" (k8s/argocd/apps/tetragon.yaml), no "hardening".
# Wave 1 y SkipDryRun: la CRD TracingPolicy llega en el mismo sync (wave 0).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: shell-en-pod
  labels:
    app.kubernetes.io/part-of: goys-tp4
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  kprobes:
    - call: security_bprm_check
      syscall: false
      message: "Shell ejecutada dentro de un contenedor"
      args:
        - index: 0
          type: linux_binprm
      selectors:
        - matchArgs:
            - index: 0
              operator: Postfix
              values:
                - "/sh"
                - "/bash"
                - "/dash"
                - "/ash"
                - "/zsh"
                - "/busybox"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
        - matchBinaries:
            - operator: Postfix
              values:
                - "/sh"
                - "/bash"
                - "/dash"
                - "/ash"
                - "/zsh"
                - "/busybox"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
