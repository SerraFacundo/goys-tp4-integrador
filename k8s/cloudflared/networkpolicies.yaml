# R13: NetworkPolicies del namespace "cloudflared". Ver docs/08-publicacion.md.
# cloudflared no recibe conexiones: el túnel es solo saliente. Las probes del
# kubelet (puerto 2000) salen del propio nodo y Cilium las deja pasar siempre.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cloudflared
  labels:
    app.kubernetes.io/part-of: goys-tp4
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/part-of: goys-tp4
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  egress:
    # DNS del cluster: resuelve el Service del Gateway y los nombres de Cloudflare.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Origen del túnel: el Service del Gateway en el puerto 8000. El Service apunta
    # a 127.0.0.1:8000 (el Envoy del propio nodo, host network) y el eBPF ve ese
    # destino como "world". "ingress" quedó del segundo intento (R13, 16/11);
    # no se probó si hace falta.
    - toEntities:
        - world
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Destino final del pedido: api:8080. Desde Cilium 1.17.2 (CVE-2025-30162)
    # Envoy aplica la política de salida del pod que hace el pedido hacia el
    # backend de la ruta, como si cloudflared le hablara directo a api. Sin esta
    # regla Envoy responde 403 sin llegar a api.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: app
            app.kubernetes.io/name: api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Red de Cloudflare: 443 para pedir el quick tunnel y 7844 para las
    # conexiones del túnel (QUIC por UDP, HTTP/2 por TCP si UDP no sale).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: TCP
            - port: "7844"
              protocol: UDP
