# M12 (kube-bench 5.1.5): la cuenta de servicio "default" del namespace no monta token.
# Ningún pod de cloudflared habla con la API de Kubernetes; los pods ya tienen
# automountServiceAccountToken: false, esto lo deja también como valor por defecto del namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cloudflared
automountServiceAccountToken: false
