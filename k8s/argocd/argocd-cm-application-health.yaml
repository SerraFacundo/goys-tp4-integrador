# M20: health check de Application en argocd-cm.
# ArgoCD no evalúa la salud de una Application hija desde la v1.8; sin esto,
# root crea la wave 1 sin esperar a que la wave 0 (hardening) esté Healthy.
# Se aplica con: kubectl -n argocd patch cm argocd-cm --type merge --patch-file <este archivo>
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
