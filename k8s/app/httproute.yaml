# App X (R07): entrada HTTP desde el Gateway de M13 hacia la API.
# Gateway definido en k8s/gateway-api/gateway.yaml (M13); su listener solo acepta rutas del namespace "app".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: goys-tp4
spec:
  parentRefs:
    - name: goys-gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 8080
