# App X (R07): entrada HTTP desde el Gateway de M13 hacia la API.
# shortcut: nombre y namespace del Gateway propuestos a Martín (M13); si cambian, ajustar parentRefs.
# El listener del Gateway tiene que aceptar rutas del namespace "app" (allowedRoutes).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: app
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: goys-tp4
spec:
  parentRefs:
    - name: goys-gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 8080
