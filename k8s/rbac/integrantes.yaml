# M14: un usuario por integrante (certificado cliente, CN = nombre).
# Binding por usuario, no por grupo: borrar el binding le quita el acceso
# aunque el certificado siga vigente. Decisión en docs/decisiones.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: goys-facundo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: facundo
---
