# N07: pods de prueba para la ValidatingAdmissionPolicy. ArgoCD NO lee esta carpeta.
# Se usan solo con --dry-run=server (pasan por la admisión, no se crea nada):
#   kubectl apply --dry-run=server -f k8s/pruebas/n07-pods.yaml
# Todos cumplen Pod Security "restricted" para que el rechazo sea de N07 y no de PSA (R14).
# Esperado: n07-ok "created (server dry run)" y los otros tres rechazados con el mensaje de N07.
apiVersion: v1
kind: Pod
metadata:
  name: n07-ok
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/serrafacundo/goys-app:fa923d5
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
---
