  <rect x="545" y="10" width="545" height="435" rx="14" fill="#F4F6F8" stroke="#002855" stroke-width="3"/>
  <text x="817" y="42" text-anchor="middle" font-size="21" font-weight="bold" fill="#002855">PC hogareña · Proxmox VE · 10.10.10.1</text>

