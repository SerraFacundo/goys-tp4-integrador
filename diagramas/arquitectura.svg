  <path d="M728 375 H600 V472 H437" fill="none" stroke="#002855" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a)"/>
  <text x="490" y="460" text-anchor="middle" font-size="15">pull</text>

  <!-- LAN bloqueada -->
  <rect x="760" y="478" width="330" height="42" rx="8" fill="#FBEAEA" stroke="#B3261E" stroke-width="2"/>
  <text x="925" y="506" text-anchor="middle" font-size="17" fill="#B3261E">LAN de la casa · 192.168.0.0/16</text>
  <line x1="700" y1="430" x2="700" y2="498" stroke="#B3261E" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="700" y1="498" x2="758" y2="498" stroke="#B3261E" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="700" y="476" text-anchor="middle" font-size="30" font-weight="bold" fill="#B3261E">✕</text>
  <text x="640" y="520" text-anchor="middle" font-size="15" fill="#B3261E">DROP en firewall</text>
