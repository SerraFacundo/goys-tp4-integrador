  <rect x="898" y="250" width="152" height="48" rx="8" fill="#fff" stroke="#002855" stroke-width="2"/>
  <text x="974" y="281" text-anchor="middle" font-size="18">redis</text>
  <line x1="880" y1="194" x2="896" y2="194" stroke="#002855" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="940" y1="218" x2="870" y2="248" stroke="#002855" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="880" y1="274" x2="896" y2="274" stroke="#002855" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="889" y="320" text-anchor="middle" font-size="15" fill="#444">namespace app · PSA restricted</text>

  <rect x="728" y="340" width="152" height="60" rx="8" fill="#fff" stroke="#00629B" stroke-width="2"/>
  <text x="804" y="366" text-anchor="middle" font-size="18">ArgoCD</text>
  <text x="804" y="389" text-anchor="middle" font-size="15">GitOps</text>
  <rect x="898" y="340" width="152" height="60" rx="8" fill="#fff" stroke="#00629B" stroke-width="2"/>
  <text x="974" y="366" text-anchor="middle" font-size="18">Hubble</text>
  <text x="974" y="389" text-anchor="middle" font-size="15">flujos L3–L7</text>

  <!-- Túneles salientes hacia Cloudflare -->
  <path d="M575 148 H437" fill="none" stroke="#00629B" stroke-width="3.5" marker-end="url(#g)"/>
  <text x="490" y="128" text-anchor="middle" font-size="16" fill="#00629B">túnel admin</text>
  <text x="490" y="170" text-anchor="middle" font-size="15" fill="#00629B">(saliente)</text>
  <path d="M728 205 H712 V320 H437" fill="none" stroke="#00629B" stroke-width="3.5" marker-end="url(#g)"/>
