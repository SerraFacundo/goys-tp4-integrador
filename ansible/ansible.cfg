[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
# accept-new: confia en la clave del host la primera vez y falla si despues cambia.
# Al recrear un nodo (R18) hay que borrar la clave vieja: ssh-keygen -R <ip>
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
